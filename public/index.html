<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

// 联系方式：画在 canvas 里的字只是外观，可点的是叠在上面的透明 <a>

};
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const F_JP = '"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans CJK JP","Noto Sans JP",sans-serif';
const F_CN = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif';
const F_MO = 'ui-monospace,"SF Mono",Menlo,Consolas,monospace';
const INK_C = '29,27,56', INK_W = '64,30,62';
const CAP = [0, 3, 6, 16, 6];            // 每种表面最多能积几层雪：字 / 头像 / 地面 / 鲨鲨
const PETAL = new Path2D('M0 .55C-.55 .2-.47-.42-.13-.5L0-.35L.13-.5C.47-.42.55 .2 0 .55Z');
const PCOL = [['#f6b3c1','#e597a8'],['#f3a2b4','#d98599'],['#f8c6d0','#e6a9b6'],['#fbdde4','#ecc0ca']];
const NB = 8;                               // 草地按远近分几层画
const SQ = 26;                              // 花的缓存图按开合进度分几档
const LG = vnorm([-.42, -.74, .52]);        // 光从左上前方来
const HAZE = hex('#aca3c2');                // 远处的花草往这个颜色褪
function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const mulc = (a, k) => [Math.min(255, a[0] * k), Math.min(255, a[1] * k), Math.min(255, a[2] * k)];
const css = (c, al = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${al})`;
const sm = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
// 花瓣轮廓：t 从花托到瓣尖，返回半宽
const PROF = {
  hep: t => Math.pow(Math.sin(Math.PI * (.05 + .95 * Math.pow(t, .85))), .62),
  drop: t => Math.pow(Math.sin(Math.PI * (.05 + .95 * Math.pow(t, .72))), .7),
  cro: t => Math.pow(Math.sin(Math.PI * (.06 + .94 * Math.pow(t, .62))), .55),
  round: t => Math.pow(Math.sin(Math.PI * (.08 + .92 * t)), .5),
  bract: t => Math.pow(Math.sin(Math.PI * (.1 + .9 * Math.pow(t, .8))), .55),

// 每种花瓣正面 f、背面 b 从花托到瓣尖的渐变
const cs = (f0, f1, b0, b1) => ({ f: [[0, hex(f0)], [1, hex(f1)]], b: [[0, hex(b0)], [1, hex(b1)]] });
const HEPC = [cs('#e98fab', '#fbd0dc', '#dca0b3', '#f1cfd9'), cs('#ece0ef', '#fffcfd', '#dcd2e4', '#f4eff6'), cs('#86a5e6', '#c3d8f8', '#9fb1e2', '#ccd8f2')];
const SEPC = cs('#6f8b6f', '#90a98a', '#6a8468', '#8aa184');
const DROPC = cs('#e3e7f0', '#ffffff', '#dde2ee', '#fbfcff');
const DROPIN = { f: [[0, hex('#eef2ee')], [.5, hex('#f8fbf7')], [.76, hex('#86b386')], [1, hex('#a9caa4')]], b: [[0, hex('#e9eee9')], [.7, hex('#f4f7f3')], [1, hex('#c9dcc5')]] };
const CROC = [{ ...cs('#8f78cc', '#cfc1f2', '#a08bd4', '#dcd1f5'), st: hex('#6b55a8') }, { ...cs('#dcd0f0', '#fdfbff', '#cfc1e8', '#f3eefb'), st: hex('#9a85cf') }];
const VERC = cs('#5b8fdc', '#acd0f6', '#7fa4dc', '#b9d0ef'), VERL = cs('#b7cdf0', '#e5eefb', '#c2d2ee', '#e3ebf8');
const FUKO = cs('#8eaa6f', '#cddb9d', '#94ad76', '#c0d197'), FUKI = cs('#b4c98b', '#e6ebb8', '#adc285', '#dbe3ad');
const LEAF_D = hex('#4c6658'), LEAF_L = hex('#6e8a72');
const G_DK = hex('#5b7868'), G_LT = hex('#88a590');

const av = new Image();
av.src = 'avatar.webp';

let W = 0, H = 0, DPR = 1, N = 0;
let g, st, pos, list, cnt = 0, sc, sx, simg, sd, dirt;
let L, gy, tC, tW, mC, mW, gC, gW, Y0 = 0, TY0 = 0, TY1 = 0;
let lineY = 0, lineFrac = -1, aim = null, foc = false, touched = false, nudge = -1;   // aim：温度线要去的高度，null 就回到两句签名中间
let T = 0, wind = 0, glintT = 0, hoverLk = null, vacc = 0;
let fl = [], pe = [], dr = [], gl = [], fw = [], gs = [], BF = [], BG = [], GBC = [], sprBudget = 0;
let PSPR = [], bloomSpr = null;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; };

// ── 1D 噪声，画山脊用 ──
function h1(n) { n = (n << 13) ^ n; const t = (Math.imul(n, Math.imul(Math.imul(n, n), 15731) + 789221) + 1376312589) & 0x7fffffff; return 1 - t / 1073741824; }
function vn(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return h1(i) * (1 - u) + h1(i + 1) * u; }
function ridged(x, o0) { let s = 0, a = .62, fr = 1; for (let o = 0; o < 5; o++) { s += a * (1 - Math.abs(vn(x * fr + o * 17.3 + o0))); a *= .48; fr *= 2.13; } return s; }

// ── 排版：全部画在 canvas 上，字形同时就是积雪的碰撞体 ──
function lines(s) {
  const jp = (px, w = 400) => `${w} ${px * s}px ${F_JP}`;
  const cn = px => `400 ${px * s}px ${F_CN}`;
  const mo = px => `400 ${px * s}px ${F_MO}`;
  const sep = { t: '  ┆  ', f: cn(15), mut: .38 };
  return {
    name: [{ t: '雪解け', f: jp(23, 600) }],
    hand: [{ t: '@yukidoke_o', f: mo(12.5), mut: .6, lk: 'x', px: 12.5 }],
    A: [{ t: '˚‧₊· ', f: jp(17), mut: .5 }, { t: '雪がとけたら、なにになる？', f: jp(19) }, { t: ' ·₊‧˚', f: jp(17), mut: .5 }],
    B: [{ t: '—— ', f: cn(19), mut: .8 }, { t: '春になる。', f: jp(19) }],
    C: [{ t: '刚入圈', f: cn(15) }, sep, { t: '雪雪', f: cn(15) }, sep, { t: 'mtf ', f: cn(15) }, { flag: 1 }, sep, { t: '永远 14 岁', f: cn(15) }],
    D: [{ t: 'Vibe Coding 前端，听术力口，抱着鲨鲨睡觉', f: cn(15) }],
    E: [{ t: '同类互fo，私信总会回的 ', f: cn(15) }, { flake: 1 }],
    F: [{ t: '在 ', f: cn(15), mut: .72, lk: 'x', px: 15 }, { icon: 'x', lk: 'x', px: 15 }, { t: ' 关注我！', f: cn(15), mut: .72, lk: 'x', px: 15 }, { t: ' ┆  ', f: cn(15), mut: .38 },   // 全角！自带右边空白，左边少一个空格才对称
        { t: '在 ', f: cn(15), mut: .72, lk: 'gh', px: 15 }, { icon: 'gh', lk: 'gh', px: 15 }, { t: ' 上找我！', f: cn(15), mut: .72, lk: 'gh', px: 15 }],
  };
}
function measure(m, runs, s) {
  let w = 0;
  for (const r of runs) {
    if (r.t !== undefined) { m.font = r.f; r.w = m.measureText(r.t).width; }
    else r.w = r.flag ? 19 * s : r.icon ? 15 * s : 14 * s;
    w += r.w;
  }
  return w;
}
function layout() {
  const m = mk(1, 1).getContext('2d');
  let s = 1, ls = lines(1);
  const keys = ['A', 'B', 'C', 'D', 'E', 'F'];
  let mw = Math.max(...keys.map(k => measure(m, ls[k], 1)));
  const avail = W - 32;
  if (mw > avail) { s = Math.max(.74, avail / mw); ls = lines(s); mw = Math.max(...keys.map(k => measure(m, ls[k], s))); }
  measure(m, ls.name, s); measure(m, ls.hand, s);
  const groundTop = Math.round(H - clamp(H * .15, 70, 140));
  const blockH = 330 * s;
  const left = W < 700 ? 16 : Math.round(clamp(W * .5 - mw * .5 - W * .08, 40, W - mw - 40));
  const top = Math.round(clamp((groundTop - blockH) * .42, 28, groundTop - blockH - 20));
  const avR = 30 * s;
  const o = { s, left, top, bw: mw, groundTop, lines: ls };
  o.av = { x: left + avR, y: top + avR, r: avR };
  const nx = left + avR * 2 + 16 * s;
  o.pos = {
    name: [nx, top + avR - 3 * s],
    hand: [nx, top + avR + 17 * s],
  };
  const yA = top + avR * 2 + 50 * s;
  const yB = yA + 64 * s, yC = yB + 46 * s, yD = yC + 30 * s, yE = yD + 30 * s, yF = yE + 42 * s;
  Object.assign(o.pos, { A: [left, yA], B: [left, yB], C: [left, yC], D: [left, yD], E: [left, yE], F: [left, yF] });
  o.lineDefault = Math.round((yA + 6 * s + yB - 18 * s) / 2);
  o.bottom = yF + 10 * s;
  o.labelX = W < 700 ? W - 16 - 34 : Math.min(W - 60, left + mw + 44);

    let x = o.pos[k][0]; const y = o.pos[k][1];
    for (const r of ls[k]) {
      if (r.lk) {
        const last = o.links[o.links.length - 1], fs = r.px * s;
        if (last && last.k === k && last.lk === r.lk) last.x1 = x + r.w;

  o.shark = {
    k: clamp(W / 1100, .62, .95),
    x: W < 700 ? W - 78 : Math.min(W - 90, left + mw + 120),

function drawFlag(c, x, y, s, mask) {
  const w = 16 * s, h = 11 * s, t = y - 11.5 * s;
  if (mask) { c.fillRect(x, t, w, h); return; }
  const cols = ['#5bcefa', '#f5a9b8', '#ffffff', '#f5a9b8', '#5bcefa'];
  c.save(); c.beginPath(); c.roundRect ? c.roundRect(x, t, w, h, 1.6 * s) : c.rect(x, t, w, h); c.clip();
  cols.forEach((cl, i) => { c.fillStyle = cl; c.fillRect(x, t + i * h / 5, w, h / 5 + .5); });
  c.restore();
}
function drawText(c, ink, mask) {
  c.textBaseline = 'alphabetic';
  for (const k of ['name', 'hand', 'A', 'B', 'C', 'D', 'E', 'F']) {
    let [x, y] = L.pos[k];
    for (const r of L.lines[k]) {
      if (r.t !== undefined) {
        c.font = r.f;
        if (!mask) c.fillStyle = `rgba(${ink},${r.mut || 1})`;
        c.fillText(r.t, x, y);

        const k = 13.5 * L.s / 24;
        if (!mask) c.fillStyle = `rgba(${ink},${r.mut || 1})`;
        c.save(); c.translate(x + .75 * L.s, y - 12 * L.s); c.scale(k, k); c.fill(ICON[r.icon]); c.restore();

}

// ── 鲨鲨（朝左趴着，原点在肚皮底部中心） ──
function sharkBody(c) {
  c.beginPath();
  c.moveTo(-52, -11);
  c.bezierCurveTo(-49, -24, -30, -29, -8, -29);
  c.bezierCurveTo(12, -29, 28, -24, 40, -15);
  c.bezierCurveTo(45, -20, 50, -27, 57, -33);
  c.bezierCurveTo(56, -24, 53, -15, 50, -10);
  c.bezierCurveTo(53, -6, 56, -2, 58, .5);
  c.bezierCurveTo(52, -1, 46, -4, 40, -7);
  c.bezierCurveTo(28, -1, 10, .8, -12, .6);
  c.bezierCurveTo(-34, .4, -50, -3, -52, -11);
  c.closePath();
}
function sharkDorsal(c) { c.beginPath(); c.moveTo(-11, -28.5); c.bezierCurveTo(-6, -35, -1, -42, 6, -44); c.bezierCurveTo(5, -38, 6, -32, 10, -28); c.closePath(); }
function sharkPec(c) { c.beginPath(); c.moveTo(-27, -7); c.bezierCurveTo(-21, -1, -12, 1.5, -2, 1.2); c.bezierCurveTo(-8, -3, -11, -7, -13, -11); c.closePath(); }
function sharkSolid(c) { sharkBody(c); c.fill(); sharkDorsal(c); c.fill(); }
function sharkXform(c) {
  const sk = L.shark, x = sk.x, y = gy[clamp(x | 0, 0, W - 1)] + 1.5;
  c.translate(x, y); c.scale(sk.k, sk.k);
}
function drawShark(c) {
  c.save(); sharkXform(c);
  const gr = c.createLinearGradient(0, -44, 0, 2);
  gr.addColorStop(0, '#6683a8'); gr.addColorStop(.7, '#86a1c2'); gr.addColorStop(1, '#93acc9');
  c.fillStyle = gr; sharkDorsal(c); c.fill(); sharkBody(c); c.fill();
  c.save(); sharkBody(c); c.clip();
  c.fillStyle = '#f4f0f3';
  c.beginPath(); c.moveTo(-60, -8); c.bezierCurveTo(-34, -5.5, 8, -4.5, 44, -9.5); c.lineTo(64, 6); c.lineTo(-60, 6); c.closePath(); c.fill();
  c.fillStyle = 'rgba(60,70,110,.10)'; c.fillRect(-60, -2, 130, 4);
  c.restore();
  c.fillStyle = '#7b96b9'; sharkPec(c); c.fill();
  c.fillStyle = '#252536'; c.beginPath(); c.arc(-37, -17.5, 1.8, 0, 7); c.fill();
  c.fillStyle = 'rgba(255,255,255,.8)'; c.beginPath(); c.arc(-37.6, -18.2, .6, 0, 7); c.fill();
  c.strokeStyle = 'rgba(40,40,64,.55)'; c.lineWidth = .9; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-47.5, -6.8); c.quadraticCurveTo(-42, -5.2, -37, -6.6); c.stroke();
  c.restore();
}

// ── 积雪网格：0 空 / 1 实体 / 2 雪 ──
function paint(i) {
  const o = i * 4, top = i < W || g[i - W] !== 2;
  if (top) { sd[o] = 255; sd[o + 1] = 255; sd[o + 2] = 255; }
  else { sd[o] = 224; sd[o + 1] = 228; sd[o + 2] = 244; }
  sd[o + 3] = 255; mark(i);
}
function mark(i) {
  const x = i % W, y = (i / W) | 0;
  if (x < dirt[0]) dirt[0] = x; if (y < dirt[1]) dirt[1] = y;
  if (x > dirt[2]) dirt[2] = x; if (y > dirt[3]) dirt[3] = y;
}
function addSnow(i) { g[i] = 2; pos[i] = cnt; list[cnt++] = i; paint(i); if (g[i + W] === 2) paint(i + W); }
function delSnow(i) {
  g[i] = 0; const k = pos[i], last = list[--cnt]; list[k] = last; pos[last] = k; pos[i] = -1;
  sd[i * 4 + 3] = 0; mark(i);
  if (g[i + W] === 2) paint(i + W);
}
function depthOK(x, y) {
  let d = 0, yy = y + 1;
  while (yy < H && g[yy * W + x] === 2) { d++; yy++; }
  if (yy >= H) return false;
  return d < CAP[st[yy * W + x]];
}

function build() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; N = W * H;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  L = layout();
  // 地面起伏
  gy = new Float32Array(W);
  for (let x = 0; x < W; x++) gy[x] = L.groundTop + 6 * Math.sin(x * .0041 + 1.3) + 3 * Math.sin(x * .011 + .4) + 1.6 * Math.sin(x * .027);
  if (lineFrac < 0) lineY = L.lineDefault; else lineY = clamp(lineFrac * H, 24, H - 26);

  g = new Uint8Array(N); st = new Uint8Array(N); pos = new Int32Array(N).fill(-1); list = new Int32Array(N); cnt = 0;
  sc = mk(W, H); sx = sc.getContext('2d'); simg = sx.createImageData(W, H); sd = simg.data;
  dirt = [W, H, -1, -1];

  // 碰撞体：字、头像、鲨鲨、地面，各用一种颜色画，读回来分类型
  const mc = mk(W, H), m = mc.getContext('2d');
  m.fillStyle = '#f00'; drawText(m, '', true);
  m.fillStyle = '#0f0'; m.beginPath(); m.arc(L.av.x, L.av.y, L.av.r + 2, 0, 7); m.fill();
  m.fillStyle = '#ff0'; m.save(); sharkXform(m); sharkSolid(m); m.restore();
  m.fillStyle = '#00f'; m.beginPath(); m.moveTo(0, H); for (let x = 0; x < W; x++) m.lineTo(x + .5, gy[x]); m.lineTo(W, H); m.closePath(); m.fill();
  const d = m.getImageData(0, 0, W, H).data;
  for (let i = 0; i < N; i++) {
    const o = i * 4;
    if (d[o + 3] > 50) { g[i] = 1; const r = d[o] > 120, gg = d[o + 1] > 120; st[i] = r && gg ? 4 : r ? 1 : gg ? 2 : 3; }
  }

  buildLayers();
  bloomSpr = blossom(L.s);
  seedFlora();
  spawnAll();
  prewarm();
  placeIso();
  nav.textContent = ''; hoverLk = null;
  for (const l of L.links) {
    const a = document.createElement('a'), d = LINKS[l.lk];
    a.className = 'lk'; a.href = d.href; a.target = '_blank'; a.rel = 'noopener me'; a.setAttribute('aria-label', d.label);
    Object.assign(a.style, { left: l.x0 - 4 + 'px', top: l.y0 - 3 + 'px', width: l.x1 - l.x0 + 8 + 'px', height: l.y1 - l.y0 + 6 + 'px' });
    const on = () => hoverLk = l, off = () => { if (hoverLk === l) hoverLk = null; };
    a.addEventListener('pointerenter', on); a.addEventListener('pointerleave', off);
    a.addEventListener('focus', on); a.addEventListener('blur', off);
    nav.appendChild(a);
  }
}

function buildLayers() {
  // 文字两份：冷色墨（线上）和暖色墨（线下）
  TY0 = Math.max(0, Math.floor(L.top - 30)); TY1 = Math.min(H, Math.ceil(L.bottom + 20));
  const th = TY1 - TY0;
  tC = mk(W * DPR, th * DPR); tW = mk(W * DPR, th * DPR);
  for (const [c, ink] of [[tC, INK_C], [tW, INK_W]]) {
    const x = c.getContext('2d'); x.setTransform(DPR, 0, 0, DPR, 0, -TY0 * DPR); drawText(x, ink, false);
  }
  // 远山两层，线上有雪、线下是裸岩
  Y0 = Math.floor(L.groundTop - Math.min(H * .26, 240));
  const hh = H - Y0;
  mC = mk(W * DPR, hh * DPR); mW = mk(W * DPR, hh * DPR);
  gC = mk(W * DPR, hh * DPR); gW = mk(W * DPR, hh * DPR);
  const rid = [
    { amp: Math.min(H * .2, 190), sc: 330, o: 3.1, base: L.groundTop + 4, a: .55 },
    { amp: Math.min(H * .11, 105), sc: 210, o: 9.7, base: L.groundTop + 8, a: .9 },
  ];
  for (const [c, cold] of [[mC, 1], [mW, 0]]) {
    const x = c.getContext('2d'); x.setTransform(DPR, 0, 0, DPR, 0, -Y0 * DPR);
    for (const r of rid) {
      const ys = new Float32Array(W + 1);
      for (let i = 0; i <= W; i++) ys[i] = r.base - r.amp * Math.pow(ridged(i / r.sc, r.o) / 1.2, 2.4);
      const top = r.base - r.amp;
      const gr = x.createLinearGradient(0, top, 0, r.base);
      if (cold) { gr.addColorStop(0, `rgba(242,238,247,${r.a})`); gr.addColorStop(.45, `rgba(204,196,220,${r.a})`); gr.addColorStop(1, `rgba(150,142,178,${r.a})`); }
      else { gr.addColorStop(0, `rgba(128,120,158,${r.a})`); gr.addColorStop(1, `rgba(152,140,176,${r.a})`); }
      x.fillStyle = gr; x.beginPath(); x.moveTo(0, H);
      for (let i = 0; i <= W; i++) x.lineTo(i, ys[i]);
      x.lineTo(W, H); x.closePath(); x.fill();
      x.strokeStyle = cold ? `rgba(255,255,255,${r.a * .7})` : `rgba(226,214,232,${r.a * .45})`; x.lineWidth = .8;
      x.beginPath(); for (let i = 0; i <= W; i++) i ? x.lineTo(i, ys[i]) : x.moveTo(i, ys[i]); x.stroke();
    }
  }
  for (const [c, cold] of [[gC, 1], [gW, 0]]) {
    const x = c.getContext('2d'); x.setTransform(DPR, 0, 0, DPR, 0, -Y0 * DPR);
    const gr = x.createLinearGradient(0, L.groundTop - 8, 0, H);
    if (cold) { gr.addColorStop(0, '#ebe8f5'); gr.addColorStop(1, '#c7c3dc'); }
    else { gr.addColorStop(0, '#9a93b4'); gr.addColorStop(.3, '#8b8ba7'); gr.addColorStop(1, '#747b96'); }
    x.fillStyle = gr; x.beginPath(); x.moveTo(0, H);
    for (let i = 0; i < W; i++) x.lineTo(i + .5, gy[i]);
    x.lineTo(W, H); x.closePath(); x.fill();
    if (!cold) {
      // 草地上深浅不一的斑块，远处扁、近处大
      x.save(); x.clip();
      for (let i = 0, n = Math.round(W / 16); i < n; i++) {
        const px = rnd(0, W), z = Math.pow(Math.random(), 1.2), g0 = gy[px | 0], py = g0 + 2 + z * (H - g0), r = (12 + 46 * z) * rnd(.6, 1.4);
        const col = Math.random() < .62 ? '84,108,100' : '178,168,204', a = rnd(.07, .15);
        x.save(); x.translate(px, py); x.scale(1, .26);
        const rg = x.createRadialGradient(0, 0, 0, 0, 0, r);
        rg.addColorStop(0, `rgba(${col},${a})`); rg.addColorStop(1, `rgba(${col},0)`);
        x.fillStyle = rg; x.beginPath(); x.arc(0, 0, r, 0, 7); x.fill(); x.restore();
      }
      // 草皮：很密的短草，远处细碎、近处长；静态的，会动的高草另外画
      const NBT = 10, tones = [G_DK, mixc(G_DK, G_LT, .5), G_LT], P = [];
      for (let i = 0; i < NBT * 3; i++) P.push(new Path2D());
      for (let i = 0, n = Math.round(W * (H - L.groundTop) / 6); i < n; i++) {
        const x0 = Math.random() * W, z = Math.pow(Math.random(), 1.15), g0 = gy[x0 | 0], y0 = g0 + 1 + z * (H - g0 + 4);
        const s = .78 + 1.05 * z, h = rnd(1.4, 4.6) * s, w = rnd(.3, .55) * s, a = rnd(-.6, .6), sa = Math.sin(a) * h;
        const p = P[Math.min(NBT - 1, (z * NBT) | 0) * 3 + ((Math.random() * 3) | 0)];
        p.moveTo(x0 - w, y0); p.quadraticCurveTo(x0 + sa * .3 - w * .3, y0 - h * .6, x0 + sa, y0 - Math.cos(a) * h);
        p.quadraticCurveTo(x0 + sa * .3 + w * .3, y0 - h * .6, x0 + w, y0);
      }
      for (let b = 0; b < NBT; b++) for (let t = 0; t < 3; t++) {
        x.fillStyle = css(mixc(tones[t], HAZE, .5 * (1 - (b + .5) / NBT) + .1), .8); x.fill(P[b * 3 + t]);
      }
      // 远处星星点点的小花
      for (const [c, n] of [['#f3b6c6', W / 10], ['#f6f1f6', W / 12], ['#a9c3ef', W / 12]]) {
        x.fillStyle = css(mixc(hex(c), HAZE, .3)); x.beginPath();
        for (let i = 0; i < n; i++) { const px = rnd(0, W), z = Math.pow(Math.random(), 2) * .45, py = gy[px | 0] + 1 + z * (H - gy[px | 0]), r = (.45 + .5 * Math.random()) * (.78 + 1.05 * z); x.moveTo(px + r, py); x.arc(px, py, r, 0, 7); }
        x.fill();
      }
      x.restore();
    }
    x.strokeStyle = cold ? 'rgba(255,255,255,.9)' : 'rgba(214,204,226,.5)'; x.lineWidth = 1;
    x.beginPath(); for (let i = 0; i < W; i++) i ? x.lineTo(i + .5, gy[i]) : x.moveTo(.5, gy[0]); x.stroke();
  }
}

// ── 春天的草地 ──
// 雪割草（粉 / 白 / 蓝）、雪滴花、番红花、阿拉伯婆婆纳、蜂斗菜芽，再加草丛，按远近铺满地面。
// 花头是三维的：每片花瓣有自己的朝向、开合角和卷曲，正交投影后按法线打光、按前后排序，
// 画进这株花自己的小缓存图；只有开合进度变了才重画。
function vadd(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function vmul(a, s) { return [a[0] * s, a[1] * s, a[2] * s]; }
function vdot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function vcross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
function vnorm(a) { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
function basis(a) { const u = vnorm(vcross(a, Math.abs(a[2]) < .9 ? [0, 0, 1] : [1, 0, 0])); return [u, vcross(a, u)]; }
function ring(u, v, al) { return vadd(vmul(u, Math.cos(al)), vmul(v, Math.sin(al))); }
// 朝向：phi 是离开竖直向上的角度，psi 绕竖轴转（0 = 正对观者）。屏幕 y 向下，z 朝观者
function axis(phi, psi) { return vnorm([Math.sin(phi) * Math.sin(psi), -Math.cos(phi), Math.sin(phi) * Math.cos(psi)]); }

// 一片花瓣：从花托沿 d 伸出，和花面夹角 th（π/2 就是合拢），curl 让瓣尖继续往里（正）或往外（负）卷，cup 是两边往里兜
function petal(a, d, o) {
  const wd = vcross(a, d), K = 7, Lp = [], Rp = [], sp = [];
  let P = vadd(vmul(d, o.r0 || 0), vmul(a, o.h0 || 0)), n = a, zs = 0;
  for (let k = 0; k <= K; k++) {
    const t = k / K, th = o.th + (o.curl || 0) * t;
    const dir = vadd(vmul(d, Math.cos(th)), vmul(a, Math.sin(th)));
    const nIn = vcross(dir, wd), hw = o.w * o.prof(t), lift = vmul(nIn, (o.cup || 0) * hw);
    Lp.push(vadd(vadd(P, vmul(wd, hw)), lift));
    Rp.push(vadd(vadd(P, vmul(wd, -hw)), lift));
    sp.push(P); zs += P[2];
    if (k === 3) n = nIn;
    if (k < K) P = vadd(P, vmul(dir, o.L / K));
  }
  return { pts: Lp.concat(Rp.reverse()), sp, z: zs / (K + 1), n };
}
function smooth(x, P) {
  const n = P.length;
  x.beginPath(); x.moveTo((P[n - 1][0] + P[0][0]) / 2, (P[n - 1][1] + P[0][1]) / 2);
  for (let i = 0; i < n; i++) { const a = P[i], b = P[(i + 1) % n]; x.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
  x.closePath();
}
function paintPetal(x, pt, C, hz, lw) {
  const front = pt.n[2] >= 0, n = front ? pt.n : vmul(pt.n, -1), l = vdot(n, LG);
  const k = .74 + .34 * Math.max(0, l) + .16 * Math.max(0, -l);   // 背光那面透一点光
  const stops = front ? C.f : C.b;
  smooth(x, pt.pts);
  if (lw <= 0) {   // 远处很小的花瓣：单色，不描边
    x.fillStyle = css(mixc(mulc(mixc(stops[0][1], stops[stops.length - 1][1], .6), k), HAZE, hz)); x.fill();
    return front;
  }
  const b = pt.sp[0], e = pt.sp[pt.sp.length - 1], gr = x.createLinearGradient(b[0], b[1], e[0] + .01, e[1] + .01);
  for (const [t, c] of stops) gr.addColorStop(t, css(mixc(mulc(c, k), HAZE, hz)));
  x.fillStyle = gr; x.fill();
  x.strokeStyle = css(mixc(mulc(stops[0][1], k * .8), HAZE, hz), .4); x.lineWidth = lw; x.stroke();
  return front;
}
function drawItems(x, it, hz, lw) {
  it.sort((A, B) => A.z - B.z);
  for (const o of it) {
    if (o.fn) { o.fn(); continue; }
    const front = paintPetal(x, o.pt, o.C, hz, lw);
    if (o.after) o.after(front);
  }
}
function dots(x, pts, r, col) {
  x.fillStyle = col; x.beginPath();
  for (const P of pts) { x.moveTo(P[0] + r, P[1]); x.arc(P[0], P[1], r, 0, 6.2832); }
  x.fill();
}

// 雪割草：6~8 片花被，下面三片绿萼，中间一圈奶白雄蕊。花苞时低着头，开的时候抬起来
function headHep(x, p, g) {
  const budK = sm(.22, .62, g), openK = sm(.5, 1, g); if (budK <= 0) return;
  const s = p.s, a = axis(lerp(2, p.phi, sm(0, .7, openK)), p.psi), [u, v] = basis(a);
  const L = p.pl * (.4 + .6 * budK), th = lerp(1.36, .14, openK), curl = lerp(.1, .32, openK), it = [];
  if (a[2] < .55 || openK < .6) for (let i = 0; i < 3; i++) {   // 正对着看时萼片全被挡住，不画
    const pt = petal(a, ring(u, v, p.r0 + .5 + i * 2.0944), { r0: .2 * s, h0: -.3 * s, L: L * .42, w: L * .2, th: lerp(1.2, .45, openK), curl: .15, cup: .25, prof: PROF.hep });
    it.push({ z: pt.z, pt, C: SEPC });
  }
  for (let i = 0; i < p.n; i++) {
    const pt = petal(a, ring(u, v, p.r0 + i * 6.2832 / p.n + p.jt[i]), { r0: .3 * s, L: L * p.lj[i], w: L * .27, th: th + p.tj[i] * openK, curl, cup: .3, prof: PROF.hep });
    it.push({ z: pt.z, pt, C: HEPC[p.col] });
  }
  if (openK > .15) it.push({ z: a[2] * .2 * L + .01, fn: () => {
    const st = [], pi = [];
    for (let i = 0; i < 16; i++) {
      const r = (.12 + .2 * Math.sqrt((i + .5) / 16)) * L, h = (.14 + .08 * ((i * .618) % 1)) * L * openK;
      st.push(vadd(vmul(ring(u, v, i * 2.39996), r), vmul(a, h)));
    }
    for (let i = 0; i < 5; i++) pi.push(vadd(vmul(ring(u, v, i * 1.2566), .06 * L), vmul(a, .13 * L * openK)));
    dots(x, st, .32 * s, css(mixc(hex('#fff7ea'), HAZE, p.hz)));
    dots(x, pi, .26 * s, css(mixc(hex('#c9dfbf'), HAZE, p.hz)));
  } });
  drawItems(x, it, p.hz, s < 1.05 ? 0 : .22 * s);
}
// 雪滴花：低垂的白铃铛，三片长外瓣张开，里面三片短的瓣尖带绿斑，顶上一颗绿子房
function headDrop(x, p, g) {
  const budK = sm(.22, .62, g), openK = sm(.5, 1, g); if (budK <= 0) return;
  const s = p.s, a = vnorm([p.side * .3 + p.psi * .15, 1, .35]), [u, v] = basis(a);
  const L = p.pl * (.45 + .55 * budK), th = lerp(1.47, .72, openK), curl = lerp(.02, .45, openK), it = [];
  for (let i = 0; i < 3; i++) {
    const al = p.r0 + i * 2.0944;
    let pt = petal(a, ring(u, v, al), { r0: .22 * s, h0: .25 * s, L, w: L * .3, th, curl, cup: .45, prof: PROF.drop });
    it.push({ z: pt.z, pt, C: DROPC });
    pt = petal(a, ring(u, v, al + 1.0472), { r0: .18 * s, h0: .25 * s, L: L * .56, w: L * .21, th: 1.36, curl: -.12, cup: .5, prof: PROF.drop });
    it.push({ z: pt.z, pt, C: DROPIN });
  }
  drawItems(x, it, p.hz, s < 1.05 ? 0 : .2 * s);
  const o = vmul(a, -.5 * s), k = .6 + .4 * budK;
  const gr = x.createRadialGradient(o[0] - .3 * s, o[1] - .3 * s, 0, o[0], o[1], 1.1 * s);
  gr.addColorStop(0, css(mixc(hex('#a9c6a2'), HAZE, p.hz))); gr.addColorStop(1, css(mixc(hex('#76997a'), HAZE, p.hz)));
  x.fillStyle = gr; x.beginPath(); x.ellipse(o[0], o[1], .95 * s * k, .78 * s * k, Math.atan2(a[1], a[0]), 0, 6.2832); x.fill();
}
// 番红花：六片花被围成高脚杯，外轮背面有深色条纹，中间橙色柱头
function headCro(x, p, g) {
  const budK = sm(.2, .6, g), openK = sm(.5, 1, g); if (budK <= 0) return;
  const s = p.s, a = axis(p.phi, p.psi), [u, v] = basis(a), C = CROC[p.col];
  const L = p.pl * (.45 + .55 * budK), th = lerp(1.44, p.tho, openK), curl = lerp(.06, -.24, openK), it = [];
  for (let i = 0; i < 6; i++) {
    const out = !(i & 1);
    const pt = petal(a, ring(u, v, p.r0 + i * 1.0472), { r0: .22 * s, L: L * (out ? 1 : .9), w: L * (out ? .3 : .27), th: th + (out ? 0 : .06), curl, cup: .35, prof: PROF.cro });
    it.push({ z: pt.z, pt, C, after: front => {
      const sp = pt.sp;
      x.strokeStyle = css(mixc(C.st, HAZE, p.hz), front ? .28 : .5); x.lineWidth = .26 * s;
      x.beginPath(); x.moveTo(sp[1][0], sp[1][1]); for (let j = 2; j < 6; j++) x.lineTo(sp[j][0], sp[j][1]); x.stroke();
    } });
  }
  if (openK > .3) it.push({ z: a[2] * .45 * L + .01, fn: () => {
    const c = vmul(a, .42 * L), pts = [0, 1, 2].map(j => vadd(c, vmul(ring(u, v, p.r0 + j * 2.0944), .09 * L)));
    dots(x, pts, .36 * s, css(mixc(hex('#ef9f4c'), HAZE, p.hz)));
  } });
  drawItems(x, it, p.hz, s < 1.05 ? 0 : .22 * s);
}

function leafTri(x, cx, cy, r, ang, sq, c0, c1, hz, s) {
  // 雪割草的叶子：三浅裂，基部凹进去接叶柄，平躺在地上所以压扁
  x.save(); x.translate(cx, cy); x.scale(1, sq); x.rotate(ang);
  x.beginPath();
  for (let i = 0; i <= 42; i++) { const t = i / 42 * 6.2832, rr = r * (.72 + .28 * Math.cos(3 * t)); i ? x.lineTo(Math.cos(t) * rr, Math.sin(t) * rr) : x.moveTo(rr, 0); }
  x.closePath();
  const gr = x.createRadialGradient(-r * .2, 0, 0, 0, 0, r);
  gr.addColorStop(0, css(mixc(c1, HAZE, hz))); gr.addColorStop(1, css(mixc(c0, HAZE, hz)));
  x.fillStyle = gr; x.fill();
  x.strokeStyle = css(mixc(c1, HAZE, hz), .5); x.lineWidth = .22 * s;
  x.beginPath();
  for (const t of [0, 2.0944, -2.0944]) { x.moveTo(-r * .4, 0); x.lineTo(Math.cos(t) * r * .78, Math.sin(t) * r * .78); }
  x.stroke(); x.restore();
}
function strap(x, bx, h, w, bend, c0, c1, hz, mid) {
  // 带状叶：从根部往上拱，再往一边弯
  const tx = bx + bend * h, ty = -h * (1 - .3 * bend * bend), cx = bx + bend * h * .15, cy = ty * .8;
  const gr = x.createLinearGradient(0, 0, 0, ty - .01);
  gr.addColorStop(0, css(mixc(c0, HAZE, hz))); gr.addColorStop(1, css(mixc(c1, HAZE, hz)));
  x.fillStyle = gr; x.beginPath(); x.moveTo(bx - w, 0);
  x.quadraticCurveTo(cx - w * .7, cy, tx, ty); x.quadraticCurveTo(cx + w * .7, cy, bx + w, 0);
  x.closePath(); x.fill();
  if (mid) {
    x.strokeStyle = css(mixc(mid, HAZE, hz), .55); x.lineWidth = w * .35;
    x.beginPath(); x.moveTo(bx, 0); x.quadraticCurveTo(cx, cy, bx + (tx - bx) * .85, ty * .88); x.stroke();
  }
}
function baseHep(x, p, g) {
  const k = sm(.04, .5, g); if (k <= 0) return;
  const s = p.s, pc = css(mixc(hex('#76686d'), HAZE, p.hz));
  for (const lf of p.lv) {
    const ca = Math.cos(lf.a), sa = Math.sin(lf.a), len = lf.len * s * k, r = lf.r * s * k;
    const ex = ca * len, ey = sa * len * lf.sq - .6 * s * k;
    x.strokeStyle = pc; x.lineWidth = .4 * s;
    x.beginPath(); x.moveTo(0, 0); x.quadraticCurveTo(ex * .35, ey - 1.6 * s * k, ex, ey); x.stroke();
    leafTri(x, ex + ca * r * .44, ey + sa * r * .44 * lf.sq, r, lf.a, lf.sq, LEAF_D, LEAF_L, p.hz, s);
  }
}
function baseDrop(x, p, g) {

  // 雪面闪光
  glintT -= dt;
  if (glintT <= 0 && cnt) {
    glintT = rnd(.06, .2);
    const i = list[(Math.random() * cnt) | 0];
    if (i >= W && g[i - W] !== 2 && st[i + W] !== 3) gl.push({ x: i % W + .5, y: ((i / W) | 0) + .5, t: 0 });
  }
  for (let k = gl.length - 1; k >= 0; k--) { const q = gl[k]; q.t += dt; if (q.t > .8 || g[(q.y | 0) * W + (q.x | 0)] !== 2) gl.splice(k, 1); }

  // 花瓣
  for (let k = pe.length - 1; k >= 0; k--) {
    const p = pe[k];
    if (p.m > 0) p.m = Math.max(0, p.m - dt * 2.6);
    if (p.st === 0) {
      p.fl += p.fs * dt; p.rot += p.spin * dt;
      p.x += (wind * .8 + Math.sin(T * 1.1 + p.ph) * 15) * dt;
      p.y += (p.vy + Math.sin(p.fl * 2) * 7) * dt;
      if (p.x < -10) p.x += W + 20; else if (p.x > W + 10) p.x -= W + 20;
      if (p.y < ly - 3) { p.st = 2; }
      else if (!p.far) {
        const xi = p.x | 0;
        if (p.gl) { if (p.y >= p.gl) { restPetal(p, p.gl, true); p.gnd = 1; } }
        else {
          const yi = (p.y + p.s * .3) | 0;
          if (xi >= 0 && xi < W && yi >= 0 && yi < H && g[yi * W + xi]) {
            // 碰到地面不停在地平线上，接着往"里"落，散在整片草地上
            if (st[yi * W + xi] === 3) { const g0 = gy[xi]; p.gl = Math.max(p.y, g0 + 2 + p.gz * (H - 6 - g0)); }
            else restPetal(p, p.y, false);
          }
        }
      }
      if (p.y > H + 12) { pe.splice(k, 1); continue; }
    } else if (p.st === 1) {
      p.life -= dt;
      const xi = clamp(p.x | 0, 0, W - 1), yi = (p.y + p.s * .3 + 1) | 0;
      if (p.y < ly - 2 || p.life <= 0) p.st = 2;
      else if (!p.gnd && yi < H && !g[yi * W + xi]) { p.st = 0; }
    } else {
      p.a -= dt / (p.y < ly ? .9 : 2.2);
      if (p.a <= 0) { pe.splice(k, 1); continue; }
    }
  }
  if (pe.length > 700) pe.splice(0, pe.length - 700);

  // 融水
  for (let k = dr.length - 1; k >= 0; k--) {
    const d = dr[k];
    const xi = d.x | 0;
    if (xi < 0 || xi >= W) { dr.splice(k, 1); continue; }
    if (!d.run) {
      d.vy = Math.min(d.vy + 760 * dt, 380);
      const ny = d.y + d.vy * dt; let hit = false;
      while (d.y < ny) {
        const yi = (d.y + 1) | 0;
        if (yi >= H) { hit = true; break; }
        if (g[yi * W + xi]) { hit = true; break; }
        d.y = Math.min(ny, d.y + 1);
      }
      if (d.y > H) { dr.splice(k, 1); continue; }
      if (hit) { d.run = rnd(.2, .55); d.dir = Math.random() < .5 ? -1 : 1; d.vy = 0; d.y = Math.floor(d.y) + .2; }
    } else {
      const yi = (d.y + 1) | 0;
      if (yi < H && !g[yi * W + xi]) { d.run = 0; continue; }
      const nx = d.x + d.dir * 26 * dt, ni = (d.y | 0) * W + (nx | 0);
      if (nx < 0 || nx >= W || g[ni]) d.dir *= -1; else d.x = nx;
      d.run -= dt;
      if (d.run <= 0) {
        if (yi < H && st[yi * W + xi] === 3) for (const f of fw) if (f.z < .15 && Math.abs(f.x - d.x) < 10) { f.wt += .3; f.g = Math.min(1, f.g + .02); }
        dr.splice(k, 1);
      }
    }
  }

  // 花草：根在线下才长，各自慢半拍，所以拖上去时是一波一波开的
  for (const f of fw) grow(f, dt, ly);
  for (const t of gs) grow(t, dt, ly);
}

// ── 绘制 ──
let flakeSpr = null;
function sprite() {
  const c = mk(32, 32), x = c.getContext('2d');
  const gr = x.createRadialGradient(16, 16, 0, 16, 16, 16);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.35, 'rgba(255,255,255,.85)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 32, 32); return c;
}
function clipDraw(a, b, y0, h) {
  const y = clamp(lineY, y0, y0 + h);
  if (y > y0) { ctx.save(); ctx.beginPath(); ctx.rect(0, y0, W, y - y0); ctx.clip(); ctx.drawImage(a, 0, y0, W, h); ctx.restore(); }
  if (y < y0 + h) { ctx.save(); ctx.beginPath(); ctx.rect(0, y, W, y0 + h - y); ctx.clip(); ctx.drawImage(b, 0, y0, W, h); ctx.restore(); }
}
// 风一阵一阵从左往右扫过草地，草和花用同一个波
const gust = x => { const v = Math.sin(x * .011 - T * 1.25) * .5 + .5; return v * v; };
function grassBand(b) {
  const list = BG[b], m = RM ? .3 : 1;
  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath(); let any = false;
    for (const t of list) {
      if (t.g < .02) continue;
      const k = t.g * t.g * (3 - 2 * t.g);
      const bend = (wind * .011 + gust(t.x) * .16 + Math.sin(T * 2.1 + t.ph) * .035) * m;
      for (const bl of t.bl) {
        if (bl.l !== pass) continue;
        const h = bl.h * k, bx = t.x + bl.ox, ax = (Math.sin(bl.a) + bend) * h, ay = Math.cos(bl.a) * h * (1 - .25 * Math.abs(bend));
        const cx = bx + ax * .35, cy = t.y - ay * .62;
        ctx.moveTo(bx - bl.w, t.y + .5);
        ctx.quadraticCurveTo(cx - bl.w * .4, cy, bx + ax, t.y - ay);
        ctx.quadraticCurveTo(cx + bl.w * .4, cy, bx + bl.w, t.y + .5);
        any = true;
      }
    }
    if (any) { ctx.fillStyle = GBC[b][pass]; ctx.fill(); }
  }
}
function drawPlant(p) {
  if (p.g < .012) return;
  const q = Math.round(p.g * SQ);
  if (q !== p.q && (p.q < 0 || sprBudget-- > 0)) {   // 开合时每帧只重画有限几株，其余下一帧轮到
    p.q = q; const gq = q / SQ;
    bake(p, 'bs', p.bw, p.bh, p.bax, p.bay, BASE[p.kind], gq);
    if (p.hw) bake(p, 'hs', p.hw, p.hw, p.hw / 2, p.hw / 2, HEAD[p.kind], gq);
  }
  const bs = p.bs; ctx.drawImage(bs.img, p.x - bs.ax, p.y - bs.ay, bs.w, bs.h);
  if (!p.hw) return;
  const s = p.s, h = p.h * sm(0, .45, p.g);
  const sw = RM ? 0 : (wind * .009 + Math.sin(T * 1.5 + p.ph + p.x * .013) * .06 + gust(p.x) * .07) * p.flex;
  const tx = p.x + (Math.sin(sw) + p.lean) * h, ty = p.y - Math.cos(sw) * h;
  ctx.strokeStyle = p.stc; ctx.lineWidth = p.sw;
  ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.quadraticCurveTo(p.x + p.lean * h * .2, p.y - h * .6, tx, ty);
  let hx = tx, hy = ty, rot = sw * 1.3;
  if (p.kind === 'drop') {   // 花梗从茎顶弯下来，铃铛像钟摆一样晃
    const k = sm(.15, .6, p.g);
    hx = tx + p.side * 2.3 * s * k; hy = ty + 1.2 * s * k;
    ctx.quadraticCurveTo(tx + p.side * 1.7 * s * k, ty - 1.7 * s * k, hx, hy);
    rot = sw * 2.4;
  }
  ctx.stroke();
  const hs = p.hs, c = Math.cos(rot), si = Math.sin(rot);
  ctx.setTransform(DPR * c, DPR * si, -DPR * si, DPR * c, hx * DPR, hy * DPR);
  ctx.drawImage(hs.img, -hs.ax, -hs.ay, hs.w, hs.h);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
function drawMeadow() {
  sprBudget = 12;
  ctx.lineCap = 'round';
  // 落在草地上的花瓣按远近分到各层，压在同层的草下面
  const PB = BF.map(() => []);
  for (const p of pe) if (p.gnd && !p.far) { const g0 = gy[clamp(p.x | 0, 0, W - 1)]; PB[clamp(((p.y - g0 - 2) / (H - 8 - g0) * NB) | 0, 0, NB - 1)].push(p); }
  for (let b = 0; b < NB; b++) {
    for (const p of PB[b]) drawPetal(p);
    grassBand(b);
    for (const p of BF[b]) drawPlant(p);
  }
}

function petalSprites() {
  // 飘落的樱花瓣：花托那头深、瓣尖浅，中间一道淡脉
  PSPR = PCOL.map(pair => pair.map((h, side) => {
    const c = mk(48, 48), x = c.getContext('2d'), col = hex(h);
    x.translate(24, 24); x.scale(40, 40);
    const gr = x.createLinearGradient(0, .55, 0, -.5);
    gr.addColorStop(0, css(mulc(col, side ? .9 : .93))); gr.addColorStop(.55, css(col)); gr.addColorStop(1, css(mixc(col, [255, 255, 255], .4)));
    x.fillStyle = gr; x.fill(PETAL);
    x.strokeStyle = css(mulc(col, .86), .4); x.lineWidth = .024;
    x.beginPath(); x.moveTo(0, .48); x.quadraticCurveTo(.025, .12, 0, -.18); x.stroke();
    return c;
  }));
}
function blossom(s) {
  // 行尾 ❄ 过线后变成的那朵樱花
  const R = 8 * s, c = mk(Math.ceil(2 * R * DPR), Math.ceil(2 * R * DPR)), x = c.getContext('2d');
  x.setTransform(DPR, 0, 0, DPR, R * DPR, R * DPR); x.rotate(.3);
  for (let i = 0; i < 5; i++) {
    x.save(); x.rotate(i * 1.2566); x.translate(0, -3.3 * s); x.scale(5.6 * s, 5.6 * s);
    const gr = x.createLinearGradient(0, .55, 0, -.5);
    gr.addColorStop(0, '#e2839e'); gr.addColorStop(.5, '#f2aabd'); gr.addColorStop(1, '#fcdbe3');
    x.fillStyle = gr; x.fill(PETAL);
    x.strokeStyle = 'rgba(205,110,138,.35)'; x.lineWidth = .03; x.stroke(PETAL);
    x.restore();
  }
  x.strokeStyle = 'rgba(196,92,124,.7)'; x.lineWidth = .32 * s; x.lineCap = 'round';
  x.beginPath();
  const tips = [];
  for (let i = 0; i < 11; i++) { const a = i * .5712 + .2, r = (1.7 + (i % 3) * .35) * s; x.moveTo(0, 0); x.lineTo(Math.cos(a) * r, Math.sin(a) * r); tips.push([Math.cos(a) * r, Math.sin(a) * r]); }
  x.stroke();
  dots(x, tips, .38 * s, '#f6d27a');
  dots(x, [[0, 0]], .8 * s, '#f9e7b0');
  c.R = R; return c;
}
function drawPetal(p) {
  const fx = Math.cos(p.fl), s = p.s * (1 - p.m * .7);
  const sx = s * (Math.abs(fx) * .85 + .15) * (fx < 0 ? -1 : 1), cr = Math.cos(p.rot), sr = Math.sin(p.rot);
  ctx.globalAlpha = p.a * (p.far ? .62 : 1) * (1 - p.m * .8);
  ctx.setTransform(DPR * cr * sx, DPR * sr * sx, -DPR * sr * s, DPR * cr * s, DPR * p.x, DPR * p.y);
  ctx.drawImage(PSPR[p.ci][fx < 0 ? 1 : 0], -.6, -.6, 1.2, 1.2);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (p.m > 0) {
    ctx.globalAlpha = p.m * .9;
    const r = (p.far ? 1.2 : 2.2) * (.6 + p.m * .6);
    ctx.drawImage(flakeSpr, p.x - r * 1.6, p.y - r * 1.6, r * 3.2, r * 3.2);
  }
  ctx.globalAlpha = 1;
}
function drawFlakeIcon() {
  const f = L.flk; if (!f) return;
  const k = clamp((f.y - lineY) / 10 + .5, 0, 1);
  const s = f.s;
  ctx.save(); ctx.translate(f.x, f.y);
  if (k < 1) {
    ctx.globalAlpha = 1 - k; ctx.rotate(T * .25);
    ctx.strokeStyle = `rgba(${INK_C},.85)`; ctx.lineWidth = 1.1 * s; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3, c = Math.cos(a), si = Math.sin(a), R = 6 * s;
      ctx.moveTo(0, 0); ctx.lineTo(c * R, si * R);
      const bx = c * R * .58, by = si * R * .58, b = 2.1 * s;
      ctx.moveTo(bx, by); ctx.lineTo(bx + Math.cos(a + .75) * b, by + Math.sin(a + .75) * b);
      ctx.moveTo(bx, by); ctx.lineTo(bx + Math.cos(a - .75) * b, by + Math.sin(a - .75) * b);
    }
    ctx.stroke();
    ctx.rotate(-T * .25);
  }
  if (k > 0) {
    const R = bloomSpr.R, sc = .82 + .18 * k;
    ctx.globalAlpha = k; ctx.scale(sc, sc);
    ctx.drawImage(bloomSpr, -R, -R, 2 * R, 2 * R);
  }
  ctx.restore(); ctx.globalAlpha = 1;
}
function drawIso() {
  const y = Math.round(lineY) + .5, on = aim !== null || foc;
  const lx = L.labelX, s = Math.min(1, L.s + .1);
  ctx.fillStyle = `rgba(255,255,255,${on ? .98 : .82})`;
  const r = on ? 1 : .8;
  for (let x = 3.5; x < W; x += 7) {
    if (x > lx - 9 && x < lx + 36) continue;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  ctx.font = `500 ${11 * s}px ${F_MO}`; ctx.textBaseline = 'middle';
  ctx.fillText('0 °C', lx, y + .5);
  ctx.font = `400 ${9.5 * s}px ${F_MO}`;
  ctx.fillStyle = `rgba(${INK_C},${on ? .62 : .42})`; ctx.fillText('T < 0 °C', lx, y - 15);
  ctx.fillStyle = `rgba(${INK_W},${on ? .62 : .42})`; ctx.fillText('T > 0 °C', lx, y + 16);
  ctx.textBaseline = 'alphabetic';
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = true;
  const ly = clamp(lineY / H, 0, 1);
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#746d96');
  bg.addColorStop(Math.max(0, ly - .1), '#a49bb9');
  bg.addColorStop(Math.min(1, ly + .07), '#c3a8c0');
  bg.addColorStop(1, '#dbc5d2');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // 远处的雪和花瓣
  for (const f of fl) if (f.far) { ctx.globalAlpha = .5; const r = f.r; ctx.drawImage(flakeSpr, f.x - r * 1.6, f.y - r * 1.6, r * 3.2, r * 3.2); }
  ctx.globalAlpha = 1;
  for (const p of pe) if (p.far) drawPetal(p);

  clipDraw(mC, mW, Y0, H - Y0);
  clipDraw(gC, gW, Y0, H - Y0);
  drawShark(ctx);
  drawMeadow();
  clipDraw(tC, tW, TY0, TY1 - TY0);
  if (hoverLk) {
    const l = hoverLk, y = l.base + 3 * L.s;
    ctx.fillStyle = `rgba(${lineY > y ? INK_C : INK_W},.55)`; ctx.fillRect(l.x0, y, l.x1 - l.x0, 1);
  }
  // 头像
  const a = L.av;
  if (av.complete && av.naturalWidth) {
    ctx.save(); ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 7); ctx.clip();
    ctx.drawImage(av, a.x - a.r, a.y - a.r, a.r * 2, a.r * 2); ctx.restore();
  }
  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(a.x, a.y, a.r + 1, 0, 7); ctx.stroke();
  drawFlakeIcon();

  // 积雪层
  if (dirt[2] >= dirt[0]) {
    sx.putImageData(simg, 0, 0, dirt[0], dirt[1], dirt[2] - dirt[0] + 1, dirt[3] - dirt[1] + 1);
    dirt[0] = W; dirt[1] = H; dirt[2] = -1; dirt[3] = -1;
  }
  ctx.globalAlpha = .55;
  ctx.drawImage(sc, -.5, 0, W, H); ctx.drawImage(sc, .5, 0, W, H); ctx.drawImage(sc, 0, -.6, W, H);
  ctx.globalAlpha = 1;
  ctx.drawImage(sc, 0, 0, W, H);
  // 闪光
  ctx.strokeStyle = '#fff'; ctx.lineWidth = .6;
  for (const q of gl) {
    const k = Math.sin(Math.PI * q.t / .8), r = 2.6 * k;
    ctx.globalAlpha = k;
    ctx.beginPath(); ctx.moveTo(q.x - r, q.y - .5); ctx.lineTo(q.x + r, q.y - .5); ctx.moveTo(q.x, q.y - .5 - r); ctx.lineTo(q.x, q.y - .5 + r); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // 融水
  ctx.fillStyle = 'rgba(236,243,255,.9)';
  for (const d of dr) {
    const h = 1.3 + Math.min(d.vy * .012, 3.2);
    ctx.beginPath(); ctx.ellipse(d.x, d.y - h * .5, .85, h, 0, 0, 7); ctx.fill();
  }
  for (const p of pe) if (!p.far && !p.gnd) drawPetal(p);
  for (const f of fl) if (!f.far) { ctx.globalAlpha = f.fade ? .9 * f.fade : .92; const r = f.r; ctx.drawImage(flakeSpr, f.x - r * 1.6, f.y - r * 1.6, r * 3.2, r * 3.2); }
  ctx.globalAlpha = 1;
  drawIso();
}

// ── 交互 ──
// 温度线跟着鼠标走，不用按住；手机上手指在屏幕任何地方按住滑动都行，松手后线停在那里
// 指到链接上时线停在那一行上面一点，不压着要点的字
const follow = e => { if (!e.isPrimary) return; touched = true; nudge = -2; aim = hoverLk ? hoverLk.y0 - 9 * L.s : e.clientY; };
addEventListener('pointermove', follow);
addEventListener('pointerdown', follow);
// 鼠标移出窗口：线慢慢回到「なにになる？」和「春になる。」中间
document.addEventListener('mouseout', e => { if (!e.relatedTarget) aim = null; });
iso.addEventListener('focus', () => foc = true);
iso.addEventListener('blur', () => foc = false);
iso.addEventListener('keydown', e => {
  const dy = { ArrowUp: -12, ArrowDown: 12, PageUp: -80, PageDown: 80, Home: -1e5, End: 1e5 }[e.key];
  if (dy) { touched = true; nudge = -2; aim = clamp((aim === null ? lineY : aim) + dy, 24, H - 26); e.preventDefault(); }
});

let rt = 0;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 160); });

flakeSpr = sprite();
petalSprites();
build();
if (!RM) setTimeout(() => { if (!touched) nudge = 0; }, 1800);
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
// 先跑两秒让画面落定
for (let i = 0; i < 90; i++) update(1 / 45);
requestAnimationFrame(loop);
})();
</script>
</body>
